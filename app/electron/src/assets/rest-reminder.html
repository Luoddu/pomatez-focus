<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>科学休息</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#182033;font-family:system-ui,"Microsoft YaHei",sans-serif}
.rest-reminder{padding:30px 34px;height:100vh;overflow:auto;border:2px solid #5065ff;border-radius:16px}
h2{font-size:28px;margin:0 0 22px;line-height:1.25;-webkit-app-region:drag}
p{font-size:15px;color:#707b8f;margin:0 0 30px;line-height:1.7}
.actions{display:flex;gap:14px}button{font:600 17px system-ui;border-radius:32px;min-height:48px;flex:1;border:1px solid #e3e7f2;background:white;color:#455065;cursor:pointer}
button:last-child{background:#5065ff;border-color:#5065ff;color:white}button:focus-visible{outline:3px solid #8393ff;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}
@media(max-width:480px){.rest-reminder{padding:22px}h2{font-size:24px}p{font-size:14px;margin-bottom:20px}button{font-size:15px}}
</style></head><body><div class="rest-reminder" role="dialog" aria-modal="true" aria-labelledby="rest-reminder-title" aria-describedby="rest-reminder-line">
<h2 id="rest-reminder-title">把时间还给自己</h2><p id="rest-reminder-line" role="status">正在读取提醒…</p>
<div class="actions"><button type="button" data-action="sleep" disabled>去睡觉</button><button type="button" data-action="gym" hidden disabled>去健身</button><button type="button" data-action="focus" disabled>开始下一个番茄</button></div>
</div><script src="rest-reminder.js"></script></body></html>
